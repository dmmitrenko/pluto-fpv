; tx.ini of the Raspberry Pi transmitter; pi/deploy.sh installs it as src/tx.ini
; on the Pi. Thermal camera: 640x512 is its only mode.
[main]
pluto_uri = ip:192.168.3.1
rf_bandwidth = 2000000
tx_attenuation = 30
tx_level = 0.5
udp_in_port = 5000
max_latency_ms = 40
log_period_s = 1

[video]
source = camera
camera_name =
width = 640
height = 512
fps = 25
bitrate_kbps = 800
preset = veryfast
keyint = 25
intra_refresh = 1
log_file = video_tx.log
